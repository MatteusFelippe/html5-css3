<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="id_estado">Estado</label>
            <select name="estado" id="id_estado">
                <option value="" selected>Selecione</option> <!-- Opção padrão vazia -->

                <optgroup label="Primeiros"> <!-- Grupo de opções -->
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                </optgroup>

                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select>
        </p>

        <p>
            <label for="id_profissao">Profissão</label>
            <input type="text" name="profissao" id="id_profissao" list="lista_prof"> <!-- Atributo list -->
            <datalist id="lista_prof">
                <!-- Lista de dados, estilo select2, usuário pode escolher ou adicionar sua opção -->
                <option>Administrador</option>
                <option>Contador</option>
                <option value="DEV">Desenvolvedor</option>
                <!-- Com value, o valor que será enviado ao selecionar será o value e ele aparecerá nas opções -->
                <option value="PROF">Professor</option>
            </datalist>
        </p>

        <p>
            <label for="id_msg">Mensagem <br></label>
            <textarea name="msg" id="id_msg" cols="30" rows="10">Valor Padrão</textarea>
            <!-- Cols representa quantidade de letras até estourar o campo, e rows de linhas --> <!-- Usar POST -->
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
