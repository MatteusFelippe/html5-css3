<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
</head>

<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get">

        <p>
            <label for="id_num">Numero</label>
            <input type="range" name="num" id="id_num" min="0" max="10" value="5"
                oninput="id_valor.innerHTML = id_num.value"> <!-- JS p/ mostrar o valor no output -->
            <output id="id_valor">5</output>
        </p>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>

</html>
