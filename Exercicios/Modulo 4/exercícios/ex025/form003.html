<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Teste de formulário</h1>
    <form method="get" action="cadastro.php">
        <p>
            <label for="id_nome">Nome</label>
            <input type="text" id="id_nome" name="nome" required maxlength="30" placeholder="Nome Completo"
                autocomplete="name">
        </p>

        <p>
            <label for="id_media">Média</label>
            <input type="number" name="media" id="id_media" min="0" max="10" placeholder="De 0 a 10" step="0.1"
                value="5" required>
            <!-- Step representa variação numérica do campo -->
            <!-- Value padrão elimina placeholder -->
        </p>

        <p>
            <label for="id_mes">Período Letivo</label>
            <input type="month" name="mes" id="id_mes" value="2020-07" required> <!-- Value define um padrão -->
        </p>

        <p>
            <label for="id_dia">Dia da prova</label>
            <input type="date" name="dia" id="id_dia" value="2020-07-14">
        </p>

        <p>
            <label for="id_hora">Horário da prova</label>
            <input type="time" name="hora" id="id_hora" value="18:00">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
