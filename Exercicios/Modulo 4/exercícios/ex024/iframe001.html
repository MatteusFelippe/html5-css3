<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de IFrame</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px dashed black;
        }
    </style>
</head>

<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do
        <!-- Tamanho padrão 300x150 -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo </a>
            <!-- Conteúdo interno à tag iframe aparecerá caso o dispositivo não seja compativel com o iframe -->
        </iframe>
        pra aprender a programar
    </p>

    <p> O repositorio do Matteus <iframe src="https://matteusfelippe.github.io/projeto-android/" frameborder="0"
            height="500" width="500"> no
            <a href="https://matteusfelippe.github.io/projeto-android/" target="_blank"> Github </a>
            <!-- Conteúdo interno à tag iframe aparecerá caso o dispositivo não seja compativel com o iframe -->
        </iframe> também é
        bem legal </p>
</body>

</html>
