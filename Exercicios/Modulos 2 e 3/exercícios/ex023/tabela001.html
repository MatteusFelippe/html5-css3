<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            /*Alinhamento Horizontal*/

            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>Tabela</h1>
    <!-- Hierarquia de tabelas simples
        Table = Tabelas
            Table Row = Linhas de Tabelas 
                Table Header = Cabeçalho de tabela
                Table Data = Dados de tabela -->

    <table>
        <tr> <!--Primeira Linha-->
            <td>A1
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        <tr> <!--Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!--Ultima Linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>

    <!--Fechamento de /tr e /td não obrigatórios no HTML5-->

</body>

</html>
