<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th,
        td {
            border: 1px solid grey;
            padding: 10px;
        }

        col.cnome {
            background-color: green;
        }

        col.cgrupo {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <table>
        <colgroup>
            <col class="cnome"> <!-- Toda a primeira coluna herda o estilo da classe .cnome -->
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissao</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Ricardo</td>
            <td>M</td>
            <td>15</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Vitória</td>
            <td>F</td>
            <td>20</td>
            <td>Veterinária</td>
        </tr>
        <tr>
            <td>Juca</td>
            <td>M</td>
            <td>25</td>
            <td>Agricultor</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>F</td>
            <td>30</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Leandro</td>
            <td>M</td>
            <td>35</td>
            <td>Cantor</td>
        </tr>
    </table>
</body>

</html>
